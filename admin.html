<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurya — Espace conseil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/aurya-shared.js"></script>
<link rel="icon" id="favicon-link" href="" />
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------- STATE ---------------------------------- */
let fbAuth = null, fbDb = null, currentUser = null, isAdmin = false;
let appStage = "loading"; // loading | denied | app
let adminTab = "membres"; // membres | demandes | motsdepasse | ajouter

let membersList = null;       // [{uid, profile, items, projects, actuals}]
let selectedMember = null;    // membre sélectionné pour le détail
let editingProfile = false;

let demandesList = null;
let creatingFrom = null;      // demande en cours de traitement -> {id, nom, prenom, email, gsm}

let chatMessages = null;      // conversation du membre sélectionné

function goToLogin(){ window.location.href = "connexion.html"; }

/* ---------------------------------- INIT / AUTH GUARD ---------------------------------- */
async function loadAll(){
  if(!initFirebaseApp()){
    document.getElementById("app").innerHTML = `<div class="center-screen"><p class="muted">Configuration Firebase manquante (assets/aurya-shared.js).</p></div>`;
    return;
  }
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
  fbAuth.onAuthStateChanged(async (user)=>{
    if(!user){ goToLogin(); return; }
    currentUser = user;
    try{
      const snap = await fbDb.collection("admins").doc(user.uid).get();
      isAdmin = snap.exists;
    }catch(e){ isAdmin = false; }
    appStage = isAdmin ? "app" : "denied";
    render();
  });
}
function logout(){ fbAuth.signOut().then(goToLogin); }

/* ---------------------------------- RENDER ROOT ---------------------------------- */
function render(){
  const app = document.getElementById("app");
  if(appStage === "loading"){
    app.innerHTML = `<div class="center-screen"><p class="muted">Vérification des accès...</p></div>`;
    return;
  }
  if(appStage === "denied"){
    app.innerHTML = `
    <div class="center-screen">
      <div class="card" style="max-width:420px;text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">🔒</div>
        <h2 class="display" style="font-size:18px;margin-bottom:10px;">Accès réservé</h2>
        <p class="muted" style="font-size:14px;">Cette page est réservée à l'administratrice d'Aurya.</p>
        <div style="height:14px;"></div>
        <a href="app.html" class="btn btn-primary">← Retour à mon espace</a>
      </div>
    </div>`;
    return;
  }
  app.innerHTML = renderShell();
  attachShellListeners();
}

/* ---------------------------------- SHELL ---------------------------------- */
function renderShell(){
  const tabs = [
    {id:"membres", label:"Membres"},
    {id:"demandes", label:"Demandes"},
    {id:"motsdepasse", label:"Mots de passe"},
    {id:"ajouter", label:"Ajouter un membre"},
    {id:"contenu", label:"Contenu du site"},
  ];
  let content = "";
  if(adminTab==="membres") content = renderMembres();
  else if(adminTab==="demandes") content = renderDemandes();
  else if(adminTab==="motsdepasse") content = renderMotsDePasse();
  else if(adminTab==="ajouter") content = renderAjouterMembre();
  else if(adminTab==="contenu") content = renderContenuSite();

  return `
  <div class="wrap">
    <div class="app-header">
      <div class="brand">
        <img src="${LOGO_WORDMARK}" alt="Aurya" />
        <div class="status-row">
          <span class="status-badge">🛡️ Admin</span>
          <span class="version-tag">V01-005</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="home-icon-btn" id="btn-logout" title="Se déconnecter">${ICONS.logout}</button>
        <a href="index.html" class="home-icon-btn" title="Accueil du site">${ICONS.home}</a>
      </div>
    </div>

    <div class="admin-tabs">
      ${tabs.map(t=>`<button class="admin-tab-btn ${adminTab===t.id?'active':''}" data-admintab="${t.id}">${t.label}</button>`).join("")}
    </div>

    ${content}

    <footer class="legal-footer">
      <div class="legal-links">
        <a href="mentions-legales.html#securisation">Sécurisation</a><span class="sep">|</span>
        <a href="mentions-legales.html#confidentialite">Déclaration de confidentialité</a><span class="sep">|</span>
        <a href="mentions-legales.html#ethique">Business Ethics &amp; Governance</a><span class="sep">|</span>
        <a href="mentions-legales.html#cookies">Politique en matière de cookies</a><span class="sep">|</span>
        <a href="mentions-legales.html#responsabilite">Limitation de responsabilité</a><span class="sep">|</span>
        <a href="mentions-legales.html#mentions">Mentions légales / RGPD / CGV</a>
      </div>
      <div class="copyright-block">
        <p>© ${new Date().getFullYear()} Hélène Laruelle — Tous droits réservés. Toute copie du site ou de son code est interdite.</p>
        <p>Site développé par Hélène Laruelle.</p>
        <p>Contenu sous la responsabilité de Hélène Laruelle</p>
      </div>
    </footer>
  </div>`;
}
function attachShellListeners(){
  document.getElementById("btn-logout").addEventListener("click", logout);
  document.querySelectorAll("[data-admintab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      adminTab = btn.dataset.admintab;
      selectedMember = null; chatMessages = null;
      render();
    });
  });
  if(adminTab==="membres") attachMembresListeners();
  if(adminTab==="demandes") attachDemandesListeners();
  if(adminTab==="motsdepasse") attachMotsDePasseListeners();
  if(adminTab==="ajouter") attachAjouterMembreListeners();
  if(adminTab==="contenu") attachContenuSiteListeners();
}

/* ---------------------------------- MEMBRES ---------------------------------- */
async function loadMembers(){
  membersList = "loading"; render();
  try{
    const snap = await fbDb.collection("auryaUsers").get();
    const list = [];
    snap.forEach(doc=>{
      const d = doc.data();
      list.push({ uid: doc.id, profile:d.profile||{}, items:d.items||[], projects:d.projects||[], actuals:d.actuals||{} });
    });
    membersList = list;
  }catch(e){ console.error(e); membersList = []; }
  render();
}

function renderMembres(){
  if(selectedMember) return renderMemberDetail(selectedMember);
  if(membersList === null || membersList === "loading"){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Chargement des membres...</p></div>`;
  }
  if(membersList.length === 0){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Aucun membre pour l'instant. Va dans « Ajouter un membre ».</p></div>`;
  }
  return membersList.map(m=>{
    const t = computeTotalsFor(m.items, m.projects);
    const consent = m.profile.consentementAdmin;
    return `
    <div class="member-row" data-select-member="${m.uid}">
      <div>
        <strong>${esc(m.profile.prenom||"(sans prénom)")}</strong>
        <span class="muted-dark" style="font-size:12px;margin-left:8px;">${esc(m.profile.email||"")}</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="font-size:13px;font-weight:700;color:${t.prevSolde>=0?'var(--green)':'var(--coral)'};">${t.prevSolde>=0?'+':''}${fmt(t.prevSolde)}/mois</span>
        <span class="${consent?'consent-yes':'consent-no'}" style="font-size:11px;">${consent? '✅ Édition autorisée' : '🔒 Lecture seule'}</span>
      </div>
    </div>`;
  }).join("");
}

function computeTotalsFor(srcItems, srcProjects){
  const prevRevenu = srcItems.filter(i=>i.type==="revenu").reduce((s,i)=>s+monthlyEquivalent(i),0);
  const prevDepenseItems = srcItems.filter(i=>i.type==="depense").reduce((s,i)=>s+monthlyEquivalent(i),0);
  const prevEpargneProjets = srcProjects.reduce((s,p)=> p.termine? s : s+(Number(p.suggestionMensuelle)||0), 0);
  const prevDepenseTotal = prevDepenseItems + prevEpargneProjets;
  return { prevRevenu, prevDepenseTotal, prevSolde: prevRevenu-prevDepenseTotal };
}

function renderMemberDetail(m){
  const t = computeTotalsFor(m.items, m.projects);
  const canEdit = !!m.profile.consentementAdmin;
  return `
    <button class="btn btn-ghost" id="btn-back-members" style="margin-bottom:16px;">← Retour à la liste</button>

    <div class="card" style="background:linear-gradient(135deg, var(--card-light), var(--card));margin-bottom:16px;">
      <h2 class="display" style="font-size:20px;">${esc(m.profile.prenom||"(sans prénom)")}</h2>
      <p class="muted-dark" style="font-size:13px;">${esc(m.profile.email||"")}</p>
      <p class="muted" style="font-size:13px;margin-top:6px;">
        ${m.profile.situation==="couple"? `💞 En couple · ${Number(m.profile.nombreRevenus)||1} revenu${(Number(m.profile.nombreRevenus)||1)>1?'s':''}` : "🙋 Célibataire"}
        ${m.profile.aEnfants? ` · 👶 ${Number(m.profile.nombreEnfants)||0} enfant${(Number(m.profile.nombreEnfants)||0)>1?'s':''}` : ""}
      </p>
      <p style="margin-top:10px;">
        <span class="${canEdit?'consent-yes':'consent-no'}" style="font-size:13px;font-weight:600;">
          ${canEdit? "✅ Ce membre autorise la modification de ses informations" : "🔒 Lecture seule — le membre n'a pas activé l'autorisation de modification"}
        </span>
      </p>
    </div>

    <div class="grid3" style="margin-bottom:16px;">
      <div class="card"><div class="muted" style="font-size:12px;font-weight:700;">REVENUS / MOIS</div><p class="stat-value">${fmt(t.prevRevenu)}</p></div>
      <div class="card"><div class="muted" style="font-size:12px;font-weight:700;">DÉPENSES / MOIS</div><p class="stat-value">${fmt(t.prevDepenseTotal)}</p></div>
      <div class="card" style="background:${t.prevSolde>=0?'rgba(111,207,151,0.12)':'rgba(233,106,86,0.12)'};border:1px solid ${t.prevSolde>=0?'var(--green)':'var(--coral)'};">
        <div class="muted" style="font-size:12px;font-weight:700;">SOLDE / MOIS</div><p class="stat-value">${t.prevSolde>=0?'+':''}${fmt(t.prevSolde)}</p>
      </div>
    </div>

    ${canEdit ? `
    <div class="card" style="margin-bottom:16px;">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Modifier le profil</h3>
      <div class="field"><span>Prénom</span><input id="edit-prenom" value="${esc(m.profile.prenom||'')}" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Date de naissance</span><input id="edit-naissance" type="date" value="${esc(m.profile.naissance||'')}" /></div>
      <div style="height:12px;"></div>
      <button class="btn btn-primary" id="btn-save-member">Enregistrer les modifications</button>
      <p id="edit-feedback" class="muted-dark" style="font-size:12px;margin-top:8px;"></p>
    </div>` : ""}

    <div class="card" style="margin-bottom:16px;">
      <div class="between" style="margin-bottom:10px;"><h3 class="display" style="font-size:16px;">Postes (${m.items.length})</h3>${canEdit? `<span class="muted-dark" style="font-size:11px;">Clique la corbeille pour supprimer un poste</span>`:''}</div>
      ${m.items.length===0? `<p class="muted-dark" style="font-size:13px;">Aucun poste encodé.</p>` :
        m.items.map(i=>`
        <div class="list-row">
          <div><p style="margin:0;font-weight:500;">${esc(i.nom)} <span class="muted-dark" style="font-weight:400;">· ${esc(i.categorie)}</span></p></div>
          <div class="row">
            <span style="color:${i.type==='revenu'?'var(--green)':'var(--coral-soft)'};font-weight:600;">${fmtPrecise(monthlyEquivalent(i))}/mois</span>
            ${canEdit? `<button class="icon-btn" data-delete-item="${i.id}">${ICONS.trash}</button>` : ""}
          </div>
        </div>`).join("")}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Projets (${m.projects.length})</h3>
      ${m.projects.length===0? `<p class="muted-dark" style="font-size:13px;">Aucun projet en cours.</p>` :
        m.projects.map(p=>{
          const total = Object.values(p.historique||{}).reduce((s,v)=>s+Number(v),0);
          const pct = Math.min(100, Math.round((total/p.objectif)*100));
          return `<div class="list-row" style="display:block;">
            <div class="between"><span style="font-weight:500;">${esc(p.nom)}</span><span class="muted-dark" style="font-size:12px;">${fmt(total)} / ${fmt(p.objectif)}</span></div>
            <div class="progress-track" style="margin:8px 0 0;height:8px;"><div class="progress-fill" style="width:${pct}%;"></div></div>
          </div>`;
        }).join("")}
    </div>

    <div class="card">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">💬 Conversation</h3>
      <div class="chat-thread" id="chat-thread">
        ${chatMessages===null? `<p class="muted-dark" style="text-align:center;margin:0;">Chargement...</p>` :
          (chatMessages.length===0? `<p class="muted-dark" style="text-align:center;margin:0;">Aucun message pour l'instant.</p>` :
          chatMessages.map(msg=>{
            const isMine = msg.senderId === currentUser.uid;
            return `
            <div class="chat-msg ${isMine? 'from-admin':'from-user'}">
              <div>${esc(msg.text)}</div>
              <div class="meta">${isMine?'Toi':'Membre'} · ${msg.ts? new Date(msg.ts).toLocaleString('fr-BE'):''}</div>
            </div>`;
          }).join(""))}
      </div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Répondre au membre..." maxlength="2000" />
        <button class="btn btn-primary" id="chat-send">Envoyer</button>
      </div>
    </div>
  `;
}

async function loadMemberChat(uid){
  chatMessages = null; render();
  try{
    const snap = await fbDb.collection("chats").doc(uid).collection("messages").orderBy("ts","asc").get();
    chatMessages = [];
    snap.forEach(doc=> chatMessages.push(doc.data()));
  }catch(e){ chatMessages = []; }
  render();
}

function attachMembresListeners(){
  if(selectedMember){
    document.getElementById("btn-back-members").addEventListener("click", ()=>{ selectedMember=null; chatMessages=null; render(); });

    if(chatMessages === null) loadMemberChat(selectedMember.uid);
    const threadEl = document.getElementById("chat-thread");
    if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    function sendReply(){
      const text = chatInput.value.trim();
      if(!text) return;
      const msg = { senderId: currentUser.uid, text, ts:new Date().toISOString() };
      chatMessages = [...(chatMessages||[]), msg];
      fbDb.collection("chats").doc(selectedMember.uid).collection("messages").add(msg)
        .catch(e=>console.error(e));
      chatInput.value = "";
      render();
    }
    if(chatSend){
      chatSend.addEventListener("click", sendReply);
      chatInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") sendReply(); });
    }

    const saveBtn = document.getElementById("btn-save-member");
    if(saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        const feedback = document.getElementById("edit-feedback");
        const newProfile = { ...selectedMember.profile,
          prenom: document.getElementById("edit-prenom").value.trim() || selectedMember.profile.prenom,
          naissance: document.getElementById("edit-naissance").value,
        };
        try{
          await fbDb.collection("auryaUsers").doc(selectedMember.uid).set({ profile:newProfile }, { merge:true });
          selectedMember.profile = newProfile;
          feedback.textContent = "✅ Modifications enregistrées.";
          feedback.style.color = "var(--green)";
        }catch(e){
          feedback.textContent = "⚠️ Impossible d'enregistrer (vérifie que le membre a bien autorisé la modification).";
          feedback.style.color = "var(--coral-soft)";
        }
      });
    }

    document.querySelectorAll("[data-delete-item]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const newItems = selectedMember.items.filter(i=>i.id!==btn.dataset.deleteItem);
        try{
          await fbDb.collection("auryaUsers").doc(selectedMember.uid).set({ items:newItems }, { merge:true });
          selectedMember.items = newItems;
          render();
        }catch(e){ console.error(e); }
      });
    });
    return;
  }

  if(membersList === null){ loadMembers(); return; }
  document.querySelectorAll("[data-select-member]").forEach(row=>{
    row.addEventListener("click", ()=>{
      selectedMember = membersList.find(m=>m.uid===row.dataset.selectMember) || null;
      chatMessages = null;
      render();
    });
  });
}

/* ---------------------------------- DEMANDES ---------------------------------- */
async function loadDemandes(){
  demandesList = "loading"; render();
  try{
    const snap = await fbDb.collection("demandes").orderBy("creeLe","desc").get();
    const list = [];
    snap.forEach(doc=> list.push({ id: doc.id, ...doc.data() }));
    demandesList = list;
  }catch(e){ console.error(e); demandesList = []; }
  render();
}

function renderDemandes(){
  if(creatingFrom) return renderCreationDepuisDemande(creatingFrom);
  if(demandesList === null || demandesList === "loading"){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Chargement des demandes...</p></div>`;
  }
  const nouvelles = demandesList.filter(d=>d.statut!=="traitee");
  const traitees = demandesList.filter(d=>d.statut==="traitee");
  return `
    <h3 class="display" style="font-size:16px;margin-bottom:10px;">Nouvelles demandes (${nouvelles.length})</h3>
    ${nouvelles.length===0? `<div class="card"><p class="muted-dark" style="text-align:center;margin:0;">Aucune nouvelle demande.</p></div>` :
      nouvelles.map(d=>`
      <div class="card" style="margin-bottom:10px;">
        <div class="between">
          <div>
            <strong>${esc(d.prenom)} ${esc(d.nom)}</strong>
            <p class="muted-dark" style="font-size:12px;margin:2px 0 0;">${esc(d.email)} · ${esc(d.gsm)}</p>
          </div>
          <button class="btn btn-primary" data-create-from="${d.id}">Créer le compte</button>
        </div>
      </div>`).join("")}

    ${traitees.length>0? `
    <h3 class="display" style="font-size:16px;margin:20px 0 10px;">Demandes traitées (${traitees.length})</h3>
    ${traitees.map(d=>`
      <div class="card" style="margin-bottom:8px;opacity:.7;">
        <strong>${esc(d.prenom)} ${esc(d.nom)}</strong>
        <span class="muted-dark" style="font-size:12px;margin-left:8px;">Identifiant créé : ${esc(d.identifiantCree||'')}</span>
      </div>`).join("")}` : ""}
  `;
}

function renderCreationDepuisDemande(d){
  return `
    <button class="btn btn-ghost" id="btn-cancel-creation" style="margin-bottom:16px;">← Annuler</button>
    <div class="card">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Créer le compte de ${esc(d.prenom)} ${esc(d.nom)}</h3>
      <div class="field"><span>Identifiant</span><input id="create-identifiant" value="${esc(genererIdentifiant(d.prenom, d.nom))}" /></div>
      <div style="height:10px;"></div>
      <div class="field">
        <span>Mot de passe</span>
        <div class="pwd-field">
          <input id="create-password" type="password" value="${esc(genererMotDePasse(d.prenom, d.nom, null))}" />
          <button type="button" class="pwd-toggle" id="toggle-create-pwd">${ICONS.eye}</button>
        </div>
      </div>
      <p class="muted-dark" style="font-size:12px;margin-top:8px;">Identifiant et mot de passe pré-remplis selon la règle habituelle, modifiables avant validation.</p>
      <p id="create-feedback" style="display:none;font-size:13px;margin-top:8px;"></p>
      <div style="height:14px;"></div>
      <button class="btn btn-primary" id="btn-confirm-create">Créer le compte</button>
    </div>
  `;
}

function attachDemandesListeners(){
  if(creatingFrom){
    document.getElementById("btn-cancel-creation").addEventListener("click", ()=>{ creatingFrom=null; render(); });
    const pwdInput = document.getElementById("create-password");
    const toggleBtn = document.getElementById("toggle-create-pwd");
    toggleBtn.addEventListener("click", ()=>{
      pwdInput.type = pwdInput.type==="password" ? "text" : "password";
    });
    document.getElementById("btn-confirm-create").addEventListener("click", async ()=>{
      const identifiant = document.getElementById("create-identifiant").value.trim();
      const password = pwdInput.value;
      const feedback = document.getElementById("create-feedback");
      feedback.style.display = "none";
      if(!identifiant || password.length < 6){
        feedback.textContent = "Identifiant requis, mot de passe de 6 caractères minimum.";
        feedback.style.color = "var(--coral)"; feedback.style.display = "block";
        return;
      }
      const email = identifiantToEmail(identifiant);
      try{
        const secondaryAuth = getSecondaryFirebaseApp().auth();
        const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
        const newUid = cred.user.uid;
        await secondaryAuth.signOut();

        const newProfile = {
          prenom: creatingFrom.prenom,
          naissance: "",
          situation: "celibataire",
          nombreRevenus: 1,
          aEnfants: false,
          nombreEnfants: 0,
          consentementAdmin: false,
          email: creatingFrom.email,
          _pwdPlain: password,
          pwdChangedAt: new Date().toISOString(),
        };
        await fbDb.collection("auryaUsers").doc(newUid).set({ profile:newProfile, items:[], projects:[], actuals:{} });
        await fbDb.collection("demandes").doc(creatingFrom.id).set({ statut:"traitee", identifiantCree:identifiant }, { merge:true });

        demandesList = demandesList.map(x=> x.id===creatingFrom.id? {...x, statut:"traitee", identifiantCree:identifiant} : x);
        creatingFrom = null;
        membersList = null; // pour recharger la liste des membres si on y retourne
        render();
      }catch(e){
        feedback.textContent = translateAuthError(e.code);
        feedback.style.color = "var(--coral)"; feedback.style.display = "block";
      }
    });
    return;
  }
  if(demandesList === null){ loadDemandes(); return; }
  document.querySelectorAll("[data-create-from]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      creatingFrom = demandesList.find(d=>d.id===btn.dataset.createFrom) || null;
      render();
    });
  });
}

/* ---------------------------------- MOTS DE PASSE ---------------------------------- */
function renderMotsDePasse(){
  if(membersList === null || membersList === "loading"){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Chargement...</p></div>`;
  }
  const withPwd = membersList.filter(m=>m.profile._pwdPlain);
  if(withPwd.length===0){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Aucun mot de passe enregistré ici (seuls les comptes créés depuis l'onglet Demandes en gardent une copie).</p></div>`;
  }
  return `
    <div class="card">
      <table>
        <thead><tr><th>Membre</th><th>Identifiant</th><th>Mot de passe</th></tr></thead>
        <tbody>
          ${withPwd.map(m=>`
          <tr>
            <td>${esc(m.profile.prenom||'')}</td>
            <td>${esc(m.profile.email||'')}</td>
            <td>
              <span class="pwd-masked" data-pwd="${esc(m.profile._pwdPlain)}">••••••••</span>
              <button class="icon-btn" data-toggle-pwd>${ICONS.eye}</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function attachMotsDePasseListeners(){
  if(membersList === null){ loadMembers(); return; }
  document.querySelectorAll("[data-toggle-pwd]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const span = btn.previousElementSibling;
      span.textContent = span.textContent.includes("•") ? span.dataset.pwd : "••••••••";
    });
  });
}

/* ---------------------------------- AJOUTER UN MEMBRE ---------------------------------- */
function renderAjouterMembre(){
  return `
    <div class="card">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Créer un nouveau membre</h3>
      <div class="field"><span>Prénom</span><input id="add-prenom" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Nom</span><input id="add-nom" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>E-mail de contact</span><input id="add-email" type="email" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Date de naissance (pour le mot de passe suggéré)</span><input id="add-naissance" type="date" /></div>
      <div style="height:14px;"></div>
      <button class="btn btn-primary" id="btn-generate-creds">Générer identifiant &amp; mot de passe →</button>
    </div>
    <div id="add-creds-zone"></div>
  `;
}
function attachAjouterMembreListeners(){
  document.getElementById("btn-generate-creds").addEventListener("click", ()=>{
    const prenom = document.getElementById("add-prenom").value.trim();
    const nom = document.getElementById("add-nom").value.trim();
    const email = document.getElementById("add-email").value.trim();
    const naissance = document.getElementById("add-naissance").value;
    if(!prenom){ alert("Indique au moins le prénom."); return; }
    const identifiant = genererIdentifiant(prenom, nom);
    const password = genererMotDePasse(prenom, nom, naissance);
    const zone = document.getElementById("add-creds-zone");
    zone.innerHTML = `
      <div class="card" style="margin-top:16px;">
        <div class="field"><span>Identifiant</span><input id="add-identifiant" value="${esc(identifiant)}" /></div>
        <div style="height:10px;"></div>
        <div class="field">
          <span>Mot de passe</span>
          <div class="pwd-field">
            <input id="add-password" type="password" value="${esc(password)}" />
            <button type="button" class="pwd-toggle" id="toggle-add-pwd">${ICONS.eye}</button>
          </div>
        </div>
        <p id="add-feedback" style="display:none;font-size:13px;margin-top:8px;"></p>
        <div style="height:14px;"></div>
        <button class="btn btn-primary" id="btn-confirm-add">Créer le compte</button>
      </div>`;
    document.getElementById("toggle-add-pwd").addEventListener("click", ()=>{
      const pwdInput = document.getElementById("add-password");
      pwdInput.type = pwdInput.type==="password" ? "text" : "password";
    });
    document.getElementById("btn-confirm-add").addEventListener("click", async ()=>{
      const idVal = document.getElementById("add-identifiant").value.trim();
      const pwdVal = document.getElementById("add-password").value;
      const feedback = document.getElementById("add-feedback");
      if(!idVal || pwdVal.length<6){
        feedback.textContent = "Identifiant requis, mot de passe de 6 caractères minimum.";
        feedback.style.color = "var(--coral)"; feedback.style.display="block";
        return;
      }
      try{
        const secondaryAuth = getSecondaryFirebaseApp().auth();
        const cred = await secondaryAuth.createUserWithEmailAndPassword(identifiantToEmail(idVal), pwdVal);
        const newUid = cred.user.uid;
        await secondaryAuth.signOut();
        const newProfile = {
          prenom, naissance, situation:"celibataire", nombreRevenus:1,
          aEnfants:false, nombreEnfants:0, consentementAdmin:false,
          email, _pwdPlain: pwdVal, pwdChangedAt: new Date().toISOString(),
        };
        await fbDb.collection("auryaUsers").doc(newUid).set({ profile:newProfile, items:[], projects:[], actuals:{} });
        membersList = null;
        feedback.textContent = "✅ Compte créé avec succès !";
        feedback.style.color = "var(--green)"; feedback.style.display="block";
      }catch(e){
        feedback.textContent = translateAuthError(e.code);
        feedback.style.color = "var(--coral)"; feedback.style.display="block";
      }
    });
  });
}

/* ---------------------------------- CONTENU DU SITE (page d'accueil) ---------------------------------- */
const DEFAULT_SITE_CONTENT = {
  slogan: "« Chaque euro trouve sa place. »",
  pitch: "Aurya transforme le budget en un espace doux et clair, où chaque décision devient plus simple. Une lumière dans le quotidien : suivi des revenus et dépenses, mensualisation des charges annuelles, projets d'épargne personnalisés, et un accompagnement personnalisé si tu le souhaites.",
  f1_emoji: "📊", f1_titre: "Postes complets", f1_texte: "Une bibliothèque de plus de 60 postes courants (logement, enfants, animaux, épargne...), en mensuel ou en annuel, convertis automatiquement.",
  f2_emoji: "🎯", f2_titre: "Projets d'épargne", f2_texte: "Fixe-toi un objectif (voyage, cadeau, imprévu...) et suis ce que tu arrives réellement à mettre de côté chaque mois.",
  f3_emoji: "💬", f3_titre: "Accompagnement", f3_texte: "Si tu le souhaites, discute directement avec Hélène pour obtenir des conseils personnalisés sur ton budget.",
};
let siteContent = null;

async function loadSiteContent(){
  siteContent = "loading"; render();
  try{
    const snap = await fbDb.collection("siteContent").doc("public").get();
    siteContent = { ...DEFAULT_SITE_CONTENT, ...(snap.exists ? snap.data() : {}) };
  }catch(e){ console.error(e); siteContent = { ...DEFAULT_SITE_CONTENT }; }
  render();
}

function renderContenuSite(){
  if(siteContent === null || siteContent === "loading"){
    return `<div class="card"><p class="muted-dark" style="text-align:center;">Chargement du contenu...</p></div>`;
  }
  const c = siteContent;
  return `
    <p class="muted" style="font-size:14px;margin-bottom:16px;">Ce texte est celui affiché sur la page de présentation publique (index.html). Toute modification est visible immédiatement, sans toucher au code.</p>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Message principal</h3>
      <div class="field"><span>Slogan</span><input id="c-slogan" value="${esc(c.slogan)}" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Texte de présentation</span><textarea id="c-pitch" rows="4" style="width:100%;background:var(--bg-deep);border:1px solid var(--card-lighter);color:var(--cream);border-radius:12px;padding:10px 12px;font-family:'Inter';font-size:14px;">${esc(c.pitch)}</textarea></div>
    </div>

    ${[1,2,3].map(n=>`
    <div class="card" style="margin-bottom:16px;">
      <h3 class="display" style="font-size:16px;margin-bottom:10px;">Carte ${n}</h3>
      <div class="field"><span>Émoji</span><input id="c-f${n}-emoji" value="${esc(c['f'+n+'_emoji'])}" style="max-width:80px;" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Titre</span><input id="c-f${n}-titre" value="${esc(c['f'+n+'_titre'])}" /></div>
      <div style="height:10px;"></div>
      <div class="field"><span>Texte</span><textarea id="c-f${n}-texte" rows="3" style="width:100%;background:var(--bg-deep);border:1px solid var(--card-lighter);color:var(--cream);border-radius:12px;padding:10px 12px;font-family:'Inter';font-size:14px;">${esc(c['f'+n+'_texte'])}</textarea></div>
    </div>`).join("")}

    <p id="content-feedback" style="display:none;font-size:13px;margin-bottom:10px;"></p>
    <button class="btn btn-primary" id="btn-save-content">Enregistrer et publier</button>
  `;
}

function attachContenuSiteListeners(){
  if(siteContent === null){ loadSiteContent(); return; }
  const saveBtn = document.getElementById("btn-save-content");
  if(!saveBtn) return;
  saveBtn.addEventListener("click", async ()=>{
    const feedback = document.getElementById("content-feedback");
    const updated = {
      slogan: document.getElementById("c-slogan").value.trim() || DEFAULT_SITE_CONTENT.slogan,
      pitch: document.getElementById("c-pitch").value.trim() || DEFAULT_SITE_CONTENT.pitch,
      f1_emoji: document.getElementById("c-f1-emoji").value.trim() || DEFAULT_SITE_CONTENT.f1_emoji,
      f1_titre: document.getElementById("c-f1-titre").value.trim() || DEFAULT_SITE_CONTENT.f1_titre,
      f1_texte: document.getElementById("c-f1-texte").value.trim() || DEFAULT_SITE_CONTENT.f1_texte,
      f2_emoji: document.getElementById("c-f2-emoji").value.trim() || DEFAULT_SITE_CONTENT.f2_emoji,
      f2_titre: document.getElementById("c-f2-titre").value.trim() || DEFAULT_SITE_CONTENT.f2_titre,
      f2_texte: document.getElementById("c-f2-texte").value.trim() || DEFAULT_SITE_CONTENT.f2_texte,
      f3_emoji: document.getElementById("c-f3-emoji").value.trim() || DEFAULT_SITE_CONTENT.f3_emoji,
      f3_titre: document.getElementById("c-f3-titre").value.trim() || DEFAULT_SITE_CONTENT.f3_titre,
      f3_texte: document.getElementById("c-f3-texte").value.trim() || DEFAULT_SITE_CONTENT.f3_texte,
    };
    try{
      await fbDb.collection("siteContent").doc("public").set(updated, { merge:true });
      siteContent = updated;
      feedback.textContent = "✅ Contenu publié sur la page d'accueil.";
      feedback.style.color = "var(--green)"; feedback.style.display = "block";
    }catch(e){
      feedback.textContent = "⚠️ Impossible d'enregistrer, réessaie.";
      feedback.style.color = "var(--coral)"; feedback.style.display = "block";
    }
  });
}
