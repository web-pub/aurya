/* ---------------------------------- STATE ---------------------------------- */
let profile = null;
let items = [];
let projects = [];
let actuals = {};
let activeTab = "accueil";
let prefillProject = null;

let postesFormOpen = false;
let editingItemId = null;

/* appStage: "loading" | "onboarding" | "app" */
let appStage = "loading";

let fbAuth = null, fbDb = null, currentUser = null;
let isUserAlsoAdmin = false;
function userDocRef(){ return fbDb.collection("auryaUsers").doc(currentUser.uid); }

/* ---------------------------------- STORAGE (Firestore) ---------------------------------- */
async function loadUserDoc(){
  try{
    const snap = await userDocRef().get();
    if(snap.exists) return snap.data();
    return null;
  }catch(e){ console.error("Erreur de lecture Firestore", e); return null; }
}
function saveProfile(){ if(currentUser) userDocRef().set({ profile }, { merge:true }).catch(e=>console.error(e)); }
function saveItems(){ if(currentUser) userDocRef().set({ items }, { merge:true }).catch(e=>console.error(e)); }
function saveProjects(){ if(currentUser) userDocRef().set({ projects }, { merge:true }).catch(e=>console.error(e)); }
function saveActuals(){ if(currentUser) userDocRef().set({ actuals }, { merge:true }).catch(e=>console.error(e)); }

/* ---------------------------------- INIT / SESSION ---------------------------------- */
function goToLogin(){ window.location.href = "connexion.html"; }

/* Détermine la prochaine étape obligatoire après chargement du profil :
   1) validation du ROI (toujours en premier, avant toute autre chose)
   2) renouvellement du mot de passe si expiré
   3) application normale */
function nextStageAfterProfile(p){
  if(!p.roiAccepteLe) return "roi";
  if(motDePasseExpire(p)) return "pwdexpired";
  return "app";
}

async function loadAll(){
  if(!initFirebaseApp()){
    document.getElementById("app").innerHTML = `<div class="center-screen"><p class="muted">Configuration Firebase manquante (assets/aurya-shared.js).</p></div>`;
    return;
  }
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
  fbAuth.onAuthStateChanged(async (user) => {
    if(!user){ goToLogin(); return; }
    currentUser = user;
    fbDb.collection("admins").doc(user.uid).get()
      .then(snap => { isUserAlsoAdmin = snap.exists; if(appStage==="app") render(); })
      .catch(()=>{});
    const data = await loadUserDoc();
    if(data && data.profile){
      profile = data.profile; items = data.items||[]; projects = data.projects||[]; actuals = data.actuals||{};
      appStage = nextStageAfterProfile(profile);
      // Trace discrète de la dernière connexion, visible par l'admin dans la liste des membres
      userDocRef().update({ "profile.derniereConnexion": new Date().toISOString() }).catch(()=>{});
    } else {
      appStage = "onboarding";
    }
    render();
  });
}

function logout(){
  fbAuth.signOut().then(()=>{ goToLogin(); });
}

/* ---------------------------------- Changement de mot de passe (partagé) ---------------------------------- */
async function doChangePassword(oldPwd, newPwd){
  const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPwd);
  await currentUser.reauthenticateWithCredential(cred);
  await currentUser.updatePassword(newPwd);
  profile = { ...profile, pwdChangedAt: new Date().toISOString() };
  delete profile._pwdPlain; // la copie en clair gardée par l'admin devient obsolète dès que le membre change lui-même son mot de passe
  saveProfile();
  // Retire aussi le champ côté Firestore (saveProfile ne fait que fusionner, il n'efface pas les champs absents)
  if(currentUser) userDocRef().update({ "profile._pwdPlain": firebase.firestore.FieldValue.delete() }).catch(()=>{});
}

/* ---------------------------------- ROI (Règlement d'Ordre Intérieur) — validation obligatoire ---------------------------------- */
const DEFAULT_ROI = `En utilisant Aurya, tu acceptes le présent règlement d'ordre intérieur.

1. Aurya est un outil personnel de suivi budgétaire. Les données que tu encodes (revenus, dépenses, projets d'épargne) restent ta propriété et te sont strictement personnelles.

2. Si tu renseignes des informations concernant tes enfants (prénom, date de naissance, niveau d'étude), tu le fais en tant que représentant légal, dans le seul but de personnaliser les conseils qui te sont donnés. Ces données bénéficient de la même confidentialité que le reste de ton profil et ne sont jamais utilisées à d'autres fins.

3. Si tu autorises Hélène à consulter tes données pour te conseiller, elle s'engage à en faire un usage confidentiel, uniquement dans le but de t'accompagner.

4. Les conseils donnés par Hélène, que ce soit via le chat, un rendez-vous ou la page Conseils, sont donnés à titre purement informatif et indicatif. Ils ne remplacent pas l'avis d'un professionnel agréé (comptable, conseiller financier, avocat). Hélène Laruelle n'exerce pas la profession réglementée d'expert-comptable ni de conseiller en placements.

5. Chaque personne reste seule responsable des décisions financières qu'elle prend, y compris sur base des échanges avec Hélène. La responsabilité d'Hélène Laruelle ne pourra en aucun cas être engagée en cas de perte, de préjudice ou de conséquence négative liée à l'utilisation d'Aurya ou de ses conseils.

6. Ton mot de passe doit être renouvelé tous les 3 mois pour la sécurité de tes données.

7. Hélène se réserve le droit de suspendre un accès en cas d'usage abusif du service.`;

let roiText = null;
async function loadRoiText(){
  try{
    const snap = await fbDb.collection("siteContent").doc("roi").get();
    roiText = (snap.exists && snap.data().texte) ? snap.data().texte : DEFAULT_ROI;
  }catch(e){ roiText = DEFAULT_ROI; }
  render();
}

function renderRoi(){
  if(roiText === null){ loadRoiText(); return `<div class="center-screen"><p class="muted">Chargement...</p></div>`; }
  const paragraphs = roiText.split("\n\n").map(p=>`<p style="font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:12px;">${esc(p)}</p>`).join("");
  return `
  <div class="center-screen" style="background:radial-gradient(circle at 30% 20%, var(--card-light), var(--bg-deep) 70%);">
    <div class="onboard-box">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="${LOGO_WORDMARK}" alt="Aurya" style="height:56px;margin-bottom:14px;" />
      </div>
      <div class="card">
        <h2 class="display" style="font-size:18px;margin-bottom:10px;">Règlement d'ordre intérieur</h2>
        <div style="max-height:280px;overflow-y:auto;padding-right:6px;margin-bottom:14px;border-bottom:1px solid var(--card-lighter);">
          ${paragraphs}
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">
          <input type="checkbox" id="roi-accepte" style="margin-top:3px;width:16px;height:16px;" />
          <span style="font-size:13px;color:var(--muted);">J'ai lu et j'accepte le règlement d'ordre intérieur d'Aurya.</span>
        </label>
        <div style="height:14px;"></div>
        <button class="btn btn-primary" id="btn-roi-continuer" style="width:100%;" disabled>Continuer →</button>
      </div>
    </div>
  </div>`;
}
function attachRoiListeners(){
  const checkbox = document.getElementById("roi-accepte");
  const btn = document.getElementById("btn-roi-continuer");
  if(!checkbox) return;
  checkbox.addEventListener("change", ()=>{ btn.disabled = !checkbox.checked; });
  btn.addEventListener("click", ()=>{
    profile = { ...profile, roiAccepteLe: new Date().toISOString() };
    saveProfile();
    appStage = motDePasseExpire(profile) ? "pwdexpired" : "app";
    render();
  });
}

function attachPwdExpiredListeners(){
  document.querySelectorAll(".pwd-toggle[data-toggle-target]").forEach(btn=>{
    btn.innerHTML = ICONS.eye;
    btn.addEventListener("click", ()=>{
      const input = document.getElementById(btn.dataset.toggleTarget);
      input.type = input.type === "password" ? "text" : "password";
    });
  });
  document.getElementById("btn-switch-profile").addEventListener("click", logout);
  document.getElementById("btn-change-pwd").addEventListener("click", async ()=>{
    const oldPwd = document.getElementById("pwd-current").value;
    const newPwd = document.getElementById("pwd-new").value;
    const feedback = document.getElementById("pwd-feedback");
    feedback.style.display = "none";
    if(!oldPwd || newPwd.length < 8){
      feedback.textContent = "Indique ton mot de passe actuel et un nouveau mot de passe d'au moins 8 caractères.";
      feedback.style.color = "var(--coral)"; feedback.style.display = "block";
      return;
    }
    try{
      await doChangePassword(oldPwd, newPwd);
      appStage = "app";
      render();
    }catch(e){
      feedback.textContent = translateAuthError(e.code);
      feedback.style.color = "var(--coral)"; feedback.style.display = "block";
    }
  });
}

/* ---------------------------------- RENDER ROOT ---------------------------------- */
function render(){
  const app = document.getElementById("app");
  if(appStage === "loading"){
    app.innerHTML = `<div class="center-screen"><p class="muted">Aurya s'éclaire pour toi...</p></div>`;
    return;
  }
  if(appStage === "onboarding"){
    app.innerHTML = renderOnboarding();
    attachOnboardingListeners();
    return;
  }
  if(appStage === "roi"){
    app.innerHTML = renderRoi();
    attachRoiListeners();
    return;
  }
  if(appStage === "pwdexpired"){
    app.innerHTML = renderPwdExpired();
    attachPwdExpiredListeners();
    return;
  }
  app.innerHTML = renderShell();
  attachShellListeners();
}

let obState = { situation:"celibataire", nombreRevenus:1, aEnfants:false, enfants:[] };
function attachOnboardingListeners(){
  obState = { situation:"celibataire", nombreRevenus:1, aEnfants:false, enfants:[] };
  const prenomInput = document.getElementById("ob-prenom");
  const submitBtn = document.getElementById("ob-submit");
  const revenusBlock = document.getElementById("ob-revenus-block");
  const enfantsBlock = document.getElementById("ob-nombre-enfants-block");
  const enfantsListEl = document.getElementById("ob-enfants-list");
  const btnCeli = document.getElementById("ob-celibataire");
  const btnCouple = document.getElementById("ob-couple");
  const btnRev1 = document.getElementById("ob-rev-1");
  const btnRev2 = document.getElementById("ob-rev-2");
  const btnEnfantsNon = document.getElementById("ob-enfants-non");
  const btnEnfantsOui = document.getElementById("ob-enfants-oui");
  const btnAddEnfant = document.getElementById("ob-add-enfant");

  function syncEnfantsFromInputs(){ obState.enfants = readEnfantsRows(obState.enfants.length, "ob"); }
  function renderEnfantsList(){
    enfantsListEl.innerHTML = renderEnfantsRows(obState.enfants, "ob");
    enfantsListEl.querySelectorAll("[data-remove-enfant]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        syncEnfantsFromInputs();
        obState.enfants.splice(Number(btn.dataset.removeEnfant), 1);
        renderEnfantsList();
      });
    });
  }

  function styleToggle(activeBtn, inactiveBtn){
    activeBtn.style.background = "var(--royal)"; activeBtn.style.color = "var(--card)";
    inactiveBtn.style.background = "var(--bg-deep)"; inactiveBtn.style.color = "var(--muted)";
  }

  function checkValid(){ submitBtn.disabled = !prenomInput.value.trim(); }
  prenomInput.addEventListener("input", checkValid);
  checkValid();

  btnCeli.addEventListener("click", ()=>{ obState.situation="celibataire"; obState.nombreRevenus=1; styleToggle(btnCeli, btnCouple); revenusBlock.style.display="none"; });
  btnCouple.addEventListener("click", ()=>{ obState.situation="couple"; styleToggle(btnCouple, btnCeli); revenusBlock.style.display="block"; });
  btnRev1.addEventListener("click", ()=>{ obState.nombreRevenus=1; styleToggle(btnRev1, btnRev2); });
  btnRev2.addEventListener("click", ()=>{ obState.nombreRevenus=2; styleToggle(btnRev2, btnRev1); });
  btnEnfantsNon.addEventListener("click", ()=>{ obState.aEnfants=false; styleToggle(btnEnfantsNon, btnEnfantsOui); enfantsBlock.style.display="none"; });
  btnEnfantsOui.addEventListener("click", ()=>{
    obState.aEnfants=true; styleToggle(btnEnfantsOui, btnEnfantsNon); enfantsBlock.style.display="block";

    syncEnfantsFromInputs();
    obState.enfants.push({naissance:"", niveauEtude:NIVEAUX_ETUDE[0]});
    renderEnfantsList();
  });

  submitBtn.addEventListener("click", async () => {
    if(obState.aEnfants) syncEnfantsFromInputs();
    submitBtn.disabled = true; submitBtn.textContent = "Un instant...";
    profile = {
      prenom: prenomInput.value.trim(),
      naissance: document.getElementById("ob-naissance").value,
      situation: obState.situation,
      nombreRevenus: obState.situation==="couple" ? obState.nombreRevenus : 1,
      aEnfants: obState.aEnfants,
      enfants: obState.aEnfants ? obState.enfants : [],
      email: currentUser? currentUser.email : "",
    };
    items = []; projects = []; actuals = {};
    saveProfile();
    appStage = nextStageAfterProfile(profile);
    render();
  });
}

/* ---------------------------------- SHELL ---------------------------------- */
function computeTotals(srcItems, srcProjects){
  const it = srcItems || items;
  const pr = srcProjects || projects;
  const prevRevenu = it.filter(i=>i.type==="revenu" && itemEstActif(i)).reduce((s,i)=>s+monthlyEquivalent(i),0);
  const prevDepenseItems = it.filter(i=>i.type==="depense" && itemEstActif(i)).reduce((s,i)=>s+monthlyEquivalent(i),0);
  const prevEpargneProjets = pr.reduce((s,p)=> p.termine? s : s+(Number(p.suggestionMensuelle)||0), 0);
  const prevDepenseTotal = prevDepenseItems + prevEpargneProjets;
  return { prevRevenu, prevDepenseItems, prevEpargneProjets, prevDepenseTotal, prevSolde: prevRevenu-prevDepenseTotal };
}

function ratioStatus(pct, rule){
  if(!rule) return null;
  if(pct > rule.rouge) return "rouge";
  if(pct > rule.orange) return "orange";
  return "vert";
}
/* Une dépense qui existe (même minime) ne doit jamais s'afficher "0%" — trompeur.
   En dessous de 1%, on affiche "<1%" plutôt qu'un arrondi qui donnerait 0%. */
function formatPct(fraction){
  const pct = fraction*100;
  if(pct > 0 && pct < 1) return "<1%";
  return Math.round(pct) + "%";
}

  rouge: "Tes dépenses prévues dépassent presque tes revenus (ou davantage). Pas de panique : commence par repérer ce qui peut être ajusté, et n'hésite pas à en discuter avec Hélène pour construire un plan progressif.",

function computeCategoryRows(){
  const { prevRevenu } = computeTotals();
  if(prevRevenu <= 0) return { prevRevenu, rows: [] };
  const depenseItems = items.filter(i=>i.type==="depense" && itemEstActif(i));
  const parCategorie = {};
  depenseItems.forEach(i=>{
    let cat;
    if(i.categorie==="Transport" || (["Crédits","Banque & dettes","Assurances","Entretien & maison"].includes(i.categorie) && MOTS_CLES_VOITURE.test(i.nom))){
      cat = "Transport (voiture)";
    } else if(i.categorie==="Crédits" || i.categorie==="Banque & dettes"){
      cat = "Crédits / dettes";
    } else {
      cat = i.categorie;
    }
    parCategorie[cat] = (parCategorie[cat]||0) + monthlyEquivalent(i);
  });
  const rows = Object.keys(parCategorie).map(cat=>{
    const montant = parCategorie[cat];
    const pct = montant / prevRevenu;
    const status = ratioStatus(pct, RATIO_RULES[cat]);
    return { cat, montant, pct, status };
  }).sort((a,b)=>b.montant-a.montant);
  return { prevRevenu, rows };
}
const RATIO_STATUS_COLOR = { vert:"var(--green)", orange:"var(--gold)", rouge:"var(--coral)" };
const RATIO_STATUS_LABEL = { vert:"OK", orange:"À surveiller", rouge:"À corriger" };
function ratioPill(status){
  return status? `<span class="pill" style="background:${RATIO_STATUS_COLOR[status]}26;color:${RATIO_STATUS_COLOR[status]};margin-left:8px;">${RATIO_STATUS_LABEL[status]}</span>` : "";
}

function renderAnalyseRatios(){
  const { prevRevenu, prevDepenseTotal } = computeTotals();
  if(prevRevenu <= 0) return "";
  const { rows } = computeCategoryRows();
  if(rows.length===0) return "";

  const pctTotal = prevDepenseTotal / prevRevenu;
  const totalStatus = pctTotal>0.9? "rouge" : pctTotal>0.7? "orange" : "vert";
  const pctEpargne = (prevRevenu - prevDepenseTotal) / prevRevenu;
  const epargneStatus = pctEpargne>=0.10? "vert" : pctEpargne>=0.05? "orange" : "rouge";
  const statusColor = RATIO_STATUS_COLOR;
  const statusLabel = RATIO_STATUS_LABEL;
  const pill = ratioPill;

  return `
  <div class="card">
    <h3 class="display" style="font-size:16px;margin-bottom:6px;">Analyse : revenus vs dépenses</h3>
    <p class="muted" style="font-size:13px;margin-bottom:16px;">Répartition théorique de ton budget prévisionnel, par catégorie.</p>

    <div class="between" style="margin-bottom:4px;">
      <span style="font-size:14px;font-weight:600;">Dépenses totales / revenus</span>
      <span style="font-weight:700;color:${statusColor[totalStatus]};">${formatPct(pctTotal)}${pill(totalStatus)}</span>
    </div>
    <div class="progress-track" style="margin:8px 0 8px;"><div class="progress-fill" style="width:${Math.min(pctTotal*100,100)}%;background:${statusColor[totalStatus]};"></div></div>
    ${totalStatus!=='vert'? `<p style="font-size:12px;color:var(--muted);background:${statusColor[totalStatus]}14;border-radius:10px;padding:8px 10px;margin-bottom:10px;">${RATIO_ADVICE_TOTAL[totalStatus]}</p>` : ""}
    <div style="height:8px;"></div>

    <div class="between" style="margin-bottom:4px;">
      <span style="font-size:14px;font-weight:600;">Taux d'épargne (cible : 10%)</span>
      <span style="font-weight:700;color:${statusColor[epargneStatus]};">${formatPct(pctEpargne)}${pill(epargneStatus)}</span>
    </div>
    <div class="progress-track" style="margin:8px 0 8px;"><div class="progress-fill" style="width:${Math.min(Math.max(pctEpargne*100,0),100)}%;background:${statusColor[epargneStatus]};"></div></div>
    <p style="font-size:12px;color:var(--muted);background:${statusColor[epargneStatus]}14;border-radius:10px;padding:8px 10px;margin-bottom:10px;">${EPARGNE_ADVICE[epargneStatus]}</p>
    <div style="height:8px;"></div>

    ${rows.map(r=>`
      <div class="between" style="margin-bottom:${r.status && r.status!=='vert' && RATIO_ADVICE[r.cat]? '4px':'10px'};">
        <span style="font-size:13px;">${esc(r.cat)}</span>
        <span style="font-size:13px;white-space:nowrap;">
          <span class="muted-dark">${fmtPrecise(r.montant)}/mois ·</span> ${formatPct(r.pct)}${pill(r.status)}
        </span>
      </div>
      ${r.status && r.status!=='vert' && RATIO_ADVICE[r.cat] ? `<p style="font-size:12px;color:var(--muted);background:${statusColor[r.status]}14;border-radius:10px;padding:8px 10px;margin-bottom:10px;">${RATIO_ADVICE[r.cat][r.status]}</p>` : ""}`).join("")}

    <p class="muted-dark" style="font-size:11px;margin-top:14px;border-top:1px solid var(--card-lighter);padding-top:10px;">Repères indicatifs et généraux, pas un conseil personnalisé : logement au-delà de 33% des revenus, ou crédits &amp; dettes au-delà de 20-30%, sont des seuils souvent cités comme méritant attention.</p>
  </div>`;
}

/* Alertes de postes probablement manquants — jamais des reproches, juste une question :
   "tu confirmes que ce n'est pas un oubli ?". Le membre peut balayer chaque alerte,
   elle ne revient plus (stockée dans profile.alertesIgnorees). */
const ALERTES_MANQUANTES = [
  {
    id: "enfants-sans-frais",
    condition: (p, its) => p.aEnfants && !its.some(i=>i.type==="depense" && i.categorie==="Enfants"),
    message: "Tu as indiqué avoir des enfants, mais aucun poste \"Enfants\" (frais scolaires, activités...) n'est encodé. Un oubli ?",
  },
  {
    id: "pas-assurance",
    condition: (p, its) => !its.some(i=>i.type==="depense" && i.categorie==="Assurances"),
    message: "Aucune assurance encodée pour l'instant. Ce serait dommage de ne pas être couvert(e) — vérifie que ce n'est pas un oubli.",
  },
  {
    id: "voiture-sans-carburant",
    condition: (p, its) => {
      const transport = its.filter(i=>i.type==="depense" && i.categorie==="Transport");
      if(transport.length===0) return false;
      const aVoiture = its.some(i=>/voiture|auto|véhicule/i.test(i.nom));
      const aCarburant = transport.some(i=>/carburant|essence|diesel/i.test(i.nom));
      return aVoiture && !aCarburant;
    },
    message: "Tu sembles avoir une voiture, mais pas de poste \"carburant\" dans tes dépenses. Une simple omission ?",
  },
];
function renderAlertesManquantes(){
  const ignorees = Array.isArray(profile.alertesIgnorees) ? profile.alertesIgnorees : [];
  const actives = ALERTES_MANQUANTES.filter(a => !ignorees.includes(a.id) && a.condition(profile, items));
  if(actives.length===0) return "";
  return actives.map(a => `
    <div class="card dashed" style="margin-bottom:12px;">
      <div class="row" style="align-items:flex-start;justify-content:space-between;gap:12px;">
        <p style="font-size:13px;color:var(--muted);margin:0;flex:1;">${a.message}</p>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-ghost" data-goto-postes="1">Ajouter le poste</button>
        <button class="btn btn-ghost" data-dismiss-alerte="${a.id}">C'est normal, pas d'oubli</button>
      </div>
    </div>`).join("");
}

/* ---------------------------------- RÉEL VS BUDGET ---------------------------------- */
function getReelMontant(itemId, mk){
  const a = actuals[mk];
  const v = a && a.items ? a.items[itemId] : undefined;
  return v===undefined? null : Number(v);
}
function setReelMontant(itemId, mk, valeur){
  if(!actuals[mk]) actuals[mk] = {};
  if(!actuals[mk].items) actuals[mk].items = {};
  if(valeur===""){ delete actuals[mk].items[itemId]; }
  else { actuals[mk].items[itemId] = Number(valeur); }
  saveActuals();
}

function renderReelTab(){
  const mk = monthKey(comparatifYear, reelMonth);
  const depenses = items.filter(i=>i.type==="depense" && itemEstActif(i));
  const parCategorie = {};
  depenses.forEach(i=>{ (parCategorie[i.categorie] = parCategorie[i.categorie]||[]).push(i); });
  const categories = Object.keys(parCategorie).sort((a,b)=>{
    const budgetA = parCategorie[a].reduce((s,i)=>s+monthlyEquivalent(i),0);
    const budgetB = parCategorie[b].reduce((s,i)=>s+monthlyEquivalent(i),0);
    return budgetB-budgetA;
  });

  let totalBudget = 0, totalReel = 0, totalReelConnu = 0;
  const catSummaries = categories.map(cat=>{
    const catItems = parCategorie[cat];
    let budget = 0, reel = 0, tousConnus = true;
    catItems.forEach(i=>{
      budget += monthlyEquivalent(i);
      const v = getReelMontant(i.id, mk);
      if(v===null) tousConnus = false; else reel += v;
    });
    totalBudget += budget;
    if(tousConnus){ totalReel += reel; totalReelConnu += reel; }
    else { totalReel += reel; }
    return { cat, catItems, budget, reel, tousConnus };
  });

  return `
    <h2 class="display" style="font-size:20px;margin-bottom:4px;">Réel vs Budget</h2>
    <p class="muted" style="font-size:14px;margin-bottom:20px;">Encode ce que tu as réellement payé, poste par poste, et compare au budget prévu.</p>

    <div class="card" style="margin-bottom:20px;">
      <div class="between" style="margin-bottom:16px;">
        <div class="row"><h3 class="display" style="font-size:16px;">Vue d'ensemble ${comparatifYear}</h3></div>
        <div class="row">
          <button class="btn btn-ghost" id="year-prev" style="padding:6px 10px;">◀</button>
          <span style="font-weight:600;padding:0 4px;">${comparatifYear}</span>
          <button class="btn btn-ghost" id="year-next" style="padding:6px 10px;">▶</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="comparatif-canvas"></canvas></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="row" style="gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;">
        <div class="field" style="max-width:220px;"><span>Mois à encoder</span>
          <select id="reel-month">${MONTHS_FR.map((m,idx)=>`<option value="${idx}" ${idx===reelMonth?'selected':''}>${m}</option>`).join("")}</select>
        </div>
        <div class="field" style="max-width:180px;"><span>Revenus réels du mois</span><input id="reel-revenu-mois" type="number" value="${(actuals[mk] && actuals[mk].revenu!==undefined)? actuals[mk].revenu : ''}" placeholder="€" /></div>
      </div>
      <div class="between" style="padding-top:4px;border-top:1px solid var(--card-lighter);padding-top:12px;">
        <span style="font-size:14px;font-weight:600;">Total dépenses du mois</span>
        <span style="font-size:14px;">
          <span class="muted-dark">Budget :</span> <strong>${fmtPrecise(totalBudget)}</strong>
          <span class="muted-dark" style="margin-left:10px;">Réel :</span> <strong style="color:${totalReel>totalBudget?'var(--coral-soft)':'var(--green)'};">${fmtPrecise(totalReel)}</strong>
        </span>
      </div>
      <p class="muted-dark" style="font-size:11px;margin-top:6px;">Les charges annuelles (crédits, taxes...) sont comparées différemment ci-dessous : ce n'est pas parce qu'une grosse facture tombe ce mois-ci que ton budget dérape.</p>
    </div>

    ${categories.length===0? `<div class="card"><p class="muted-dark" style="text-align:center;">Ajoute d'abord des postes de dépenses dans l'onglet Postes.</p></div>` :
      catSummaries.map(cs=>{
        const ouvert = reelExpandedCat===cs.cat;
        const ecart = cs.reel - cs.budget;
        return `
        <div class="card" style="margin-bottom:10px;padding:0;overflow:hidden;">

            </div>

              <div style="font-size:13px;"><span class="muted-dark">Budget</span> ${fmtPrecise(cs.budget)}</div>
              <div style="font-size:13px;">${cs.tousConnus? `<span class="muted-dark">Réel</span> <strong style="color:${ecart>0?'var(--coral-soft)':'var(--green)'};">${fmtPrecise(cs.reel)}</strong>` : `<span class="muted-dark">Réel partiel : ${fmtPrecise(cs.reel)}</span>`}</div>
            </div>
          </div>

          <div style="padding:0 16px 16px;border-top:1px solid var(--card-lighter);">
            ${cs.catItems.map(i=>{
              const v = getReelMontant(i.id, mk);

                  <p class="muted-dark" style="font-size:12px;margin:0 0 8px;">Provisionné depuis janvier : ${fmtPrecise(provisionne)} · Payé réellement cette année : ${fmtPrecise(paye)}</p>
                  <div class="field" style="max-width:180px;"><span>Payé en ${MONTHS_FR[reelMonth]} (0 si rien payé ce mois)</span><input type="number" data-reel-input="${i.id}" value="${v!==null? v : ''}" placeholder="€" /></div>

              return `
                <div style="border-left:2px solid var(--card-lighter);padding:10px 0 10px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">

                  <input type="number" data-reel-input="${i.id}" value="${v!==null? v : ''}" placeholder="€" style="max-width:120px;" />
                </div>`;
            }).join("")}
          </div>` : ""}
        </div>`;
      }).join("")}
  `;
}

function attachReelListeners(){
  const yearPrev = document.getElementById("year-prev");
  const yearNext = document.getElementById("year-next");
  if(yearPrev) yearPrev.addEventListener("click", ()=>{ comparatifYear--; render(); });
  if(yearNext) yearNext.addEventListener("click", ()=>{ comparatifYear++; render(); });
  try{ drawComparatifChart(); }catch(e){ console.error("Erreur graphique comparatif :", e); }

  const monthSelect = document.getElementById("reel-month");
  if(monthSelect) monthSelect.addEventListener("change", ()=>{ reelMonth = Number(monthSelect.value); render(); });

  const revenuMoisInput = document.getElementById("reel-revenu-mois");
  if(revenuMoisInput) revenuMoisInput.addEventListener("change", ()=>{
    const mk = monthKey(comparatifYear, reelMonth);
    if(!actuals[mk]) actuals[mk] = {};
    actuals[mk].revenu = revenuMoisInput.value===""? undefined : Number(revenuMoisInput.value);
    saveActuals();
  });

  document.querySelectorAll("[data-toggle-cat-reel]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const cat = el.dataset.toggleCatReel;
      reelExpandedCat = reelExpandedCat===cat ? null : cat;
      render();
    });
  });

  document.querySelectorAll("[data-reel-input]").forEach(input=>{
    input.addEventListener("change", ()=>{
      const mk = monthKey(comparatifYear, reelMonth);
      setReelMontant(input.dataset.reelInput, mk, input.value);
      render();
    });
  });
}

function computeReelDepenseTotal(mk){
  const a = actuals[mk];
  if(!a || !a.items) return null;
  const depenseIds = new Set(items.filter(i=>i.type==="depense").map(i=>i.id));
  let sum=0, found=false;
  Object.keys(a.items).forEach(id=>{ if(depenseIds.has(id)){ sum += Number(a.items[id])||0; found=true; } });
  return found? sum : null;
}
function drawComparatifChart(){
  const canvas = document.getElementById("comparatif-canvas");
  if(!canvas) return;
  const { prevRevenu, prevDepenseTotal } = computeTotals();
  const data = MONTHS_SHORT.map((label, idx)=>{
    const mk = monthKey(comparatifYear, idx);
    const a = actuals[mk] || {};
    const depReelCalc = computeReelDepenseTotal(mk);
    return {
      mois:label,
      revPrev: Math.round(prevRevenu),
      revReel: a.revenu!==undefined? Math.round(Number(a.revenu)) : null,
      depPrev: Math.round(prevDepenseTotal),
      depReel: depReelCalc!==null? Math.round(depReelCalc) : (a.depense!==undefined? Math.round(Number(a.depense)) : null),
    };
  });
  if(comparatifChart) comparatifChart.destroy();
  comparatifChart = new Chart(canvas, {
    type:'bar',
    data:{
      labels: data.map(d=>d.mois),
      datasets:[
        {label:'Revenus prévus', data:data.map(d=>d.revPrev), backgroundColor:'#8A7238', borderRadius:4},
        {label:'Revenus réels', data:data.map(d=>d.revReel), backgroundColor:'#E8B94B', borderRadius:4},
        {label:'Dépenses prévues', data:data.map(d=>d.depPrev), backgroundColor:'#7A4238', borderRadius:4},
        {label:'Dépenses réelles', data:data.map(d=>d.depReel), backgroundColor:'#E96A56', borderRadius:4},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ ticks:{color:'#A9C7C0', font:{family:'Inter', size:11}}, grid:{color:'#256259'} },
        y:{ ticks:{color:'#A9C7C0', font:{family:'Inter', size:11}}, grid:{color:'#256259'} },
      },
      plugins:{ legend:{ labels:{ color:'#F6F1E4', font:{family:'Inter', size:11} } } }
    }
  });
}

function groupByCategorie(list){
  const groups = {};
  list.forEach(s=>{ (groups[s.categorie] = groups[s.categorie]||[]).push(s); });
  return groups;
}

function renderChipGroup(list, type){
  const groups = groupByCategorie(list);
  return Object.keys(groups).map(cat=>`
    <div class="chip-group">
      <div class="chip-group-title">${esc(cat)}</div>
      <div class="chips">
        ${groups[cat].map(s=>{
          const idx = (type==='revenu'? SUGGESTIONS_REVENUS : SUGGESTIONS_DEPENSES).indexOf(s);
          const key = `${type}:${idx}`;
          const selected = selectedSuggestions.has(key);
          return selectionModeOn
            ? `<button class="chip ${selected?'chip-selected':''}" data-select-suggest="${key}">${selected? '✓' : ICONS.smallplus} ${esc(s.nom)} <span class="muted-dark">${s.frequence==='annuel'? '/an':'/mois'}</span></button>`
            : `<button class="chip" data-suggest="${key}">${ICONS.smallplus} ${esc(s.nom)} <span class="muted-dark">${s.frequence==='annuel'? '/an':'/mois'}</span></button>`;
        }).join("")}

}

      label.textContent = `Montant (${freqSelect.value==='mensuel'? 'par mois' : 'par an'})`;
      if(freqSelect.value==='annuel' && montantInput.value){
        preview.style.display='block';
        preview.textContent = `On te proposera de mettre ${fmtPrecise(Number(montantInput.value)/12)} de côté chaque mois pour cette facture.`;
      } else { preview.style.display='none'; }
    }

    montantInput.addEventListener("input", updatePreview);
    updatePreview();

      posteFormType="revenu"; posteFormCat=CATEGORIES_REVENU[0];
      stashPosteFields(); render();
    });
    document.getElementById("type-depense").addEventListener("click", ()=>{
      posteFormType="depense"; posteFormCat=CATEGORIES_DEPENSE[0];
      stashPosteFields(); render();
    });

    document.getElementById("poste-save").addEventListener("click", ()=>{
      const nom = document.getElementById("poste-nom").value.trim();

      if(!nom || !montant) return;
      const dateFin = document.getElementById("poste-date-fin").value;
      const wasEditing = !!editingItemId;
      if(editingItemId){
        items = items.map(i => i.id===editingItemId ? {
          ...i, type: posteFormType, nom,
          categorie: document.getElementById("poste-cat").value,
          frequence: document.getElementById("poste-freq").value,

          dateFin,

          frequence: document.getElementById("poste-freq").value,
          montant: Number(montant),

        postesFormOpen=false;
        editingItemId=null;

function monthsRemaining(dateStr){
  if(!dateStr) return null;
  const now = new Date();
  const target = new Date(dateStr+"T00:00:00");
  const months = (target.getFullYear()-now.getFullYear())*12 + (target.getMonth()-now.getMonth());
  return Math.max(1, months);
}

function renderProjectCard(p){
  const now = new Date();
  const total = Object.values(p.historique||{}).reduce((s,v)=>s+Number(v),0);
  const pct = Math.min(100, Math.round((total/p.objectif)*100));
  const reste = Math.max(0, p.objectif-total);
  const moisPourFinir = p.suggestionMensuelle>0? Math.ceil(reste/p.suggestionMensuelle) : null;
  const EPARGNE_LABELS = { secours:"Épargne de secours", annuelles:"Épargne charges annuelles", voiture:"Épargne remplacement voiture" };

  return `
  <div class="card" style="border:1px solid ${p.termine? 'var(--green)':'var(--card-lighter)'};">
    <div class="between" style="align-items:flex-start;margin-bottom:6px;">
      <div>
        ${p.typeEpargne? `<span class="pill" style="background:rgba(184,154,106,0.15);color:var(--gold-dim);margin-bottom:6px;display:inline-block;">${EPARGNE_LABELS[p.typeEpargne]}</span><br/>` : ""}
        <h3 class="display" style="font-size:17px;">${esc(p.nom)}</h3>
        <p class="muted-dark" style="font-size:12px;margin:2px 0 0;">Objectif : ${fmt(p.objectif)}${p.dateCible? ` · pour le ${new Date(p.dateCible+"T00:00:00").toLocaleDateString("fr-BE")}` : ""}</p>
      </div>
      <button class="icon-btn" data-remove-projet="${p.id}">${ICONS.trash}</button>
    </div>
    ${p.termine? `<p style="color:var(--green);font-weight:600;font-size:14px;margin:12px 0;">Objectif atteint, bravo !</p>` : `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="between muted" style="font-size:12px;margin-bottom:10px;">
      <span>${fmt(total)} épargnés (${pct}%)</span><span>Reste ${fmt(reste)}</span>
    </div>
    <p style="color:var(--gold);font-size:12px;margin-bottom:10px;">Conseil : ${fmt(p.suggestionMensuelle)}/mois${moisPourFinir? ` — à ce rythme, tu y es dans ${moisPourFinir} mois` : ""}</p>
    `}
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <div class="field" style="flex:1;"><span>Ce mois, j'ai mis de côté</span><input type="number" placeholder="€" id="log-input-${p.id}" /></div>
      <button class="btn btn-primary" data-log-projet="${p.id}">Ajouter</button>
    </div>
  </div>`;
}

function attachProjetsListeners(){
  const openBtn = document.getElementById("btn-open-projet");
  if(openBtn) openBtn.addEventListener("click", ()=>{ projectsFormOpen=true; render(); });

  document.querySelectorAll("[data-create-epargne]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const { prevRevenu } = computeTotals();
      const type = btn.dataset.createEpargne;
      let nom, objectif, suggestionMensuelle;
      if(type==="secours"){
        nom = "Épargne de secours"; objectif = Math.round(prevRevenu*6); suggestionMensuelle = Math.max(1, Math.round(prevRevenu*0.05));
      } else if(type==="annuelles"){
        const annualDepItems = items.filter(i=>i.frequence==="annuel" && i.type==="depense" && itemEstActif(i));
        nom = "Épargne charges annuelles"; objectif = Math.round(annualDepItems.reduce((s,i)=>s+Number(i.montant),0)); suggestionMensuelle = Math.round(annualDepItems.reduce((s,i)=>s+monthlyEquivalent(i),0));
      } else {
        nom = "Épargne remplacement voiture"; objectif = 8000; suggestionMensuelle = 50;
      }
      projects.push({ id: uid(), nom, objectif, dateCible:"", suggestionMensuelle, historique:{}, termine:false, typeEpargne: type });
      saveProjects();
      render();
    });
  });

  if(projectsFormOpen){
    const objectifEl = document.getElementById("projet-objectif");
    const dateEl = document.getElementById("projet-date");
    const suggEl = document.getElementById("projet-suggestion");
    const label = document.getElementById("projet-suggestion-label");

    function updateSuggestion(){
      if(!objectifEl.value){ label.textContent = "Combien mettre de côté chaque mois (conseil : commence petit, ex 50 €)"; return; }
      const mr = monthsRemaining(dateEl.value);
      if(mr){
        const auto = Math.ceil(Number(objectifEl.value)/mr);
        label.textContent = `Combien mettre de côté chaque mois (suggestion : ${auto} €)`;
        suggEl.placeholder = String(auto);
      } else {
        label.textContent = "Combien mettre de côté chaque mois (conseil : commence petit, ex 50 €)";
        suggEl.placeholder = "50";
      }
    }
    objectifEl.addEventListener("input", updateSuggestion);
    dateEl.addEventListener("change", updateSuggestion);

    document.getElementById("projet-save").addEventListener("click", ()=>{
      const nom = document.getElementById("projet-nom").value.trim();
      const objectif = objectifEl.value;
      if(!nom || !objectif) return;
      const mr = monthsRemaining(dateEl.value);
      const autoSugg = mr? Math.ceil(Number(objectif)/mr) : 50;
      projects.push({
        id: uid(), nom, objectif: Number(objectif),
        dateCible: dateEl.value || null,
        suggestionMensuelle: Number(suggEl.value || autoSugg),
        historique: {}, termine: false,
      });
      saveProjects();
      projectsFormOpen=false; prefillProject=null;
      render();
    });
    document.getElementById("projet-cancel").addEventListener("click", ()=>{ projectsFormOpen=false; prefillProject=null; render(); });
  }

  document.querySelectorAll("[data-remove-projet]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      projects = projects.filter(p=>p.id!==btn.dataset.removeProjet);
      saveProjects(); render();
    });
  });
  document.querySelectorAll("[data-log-projet]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.logProjet;
      const input = document.getElementById(`log-input-${id}`);
      const montant = input.value;
      if(!montant) return;
      const now = new Date();
      const mk = monthKey(now.getFullYear(), now.getMonth());
      projects = projects.map(p=>{
        if(p.id!==id) return p;
        const historique = {...p.historique, [mk]: (Number(p.historique[mk])||0)+Number(montant)};
        const total = Object.values(historique).reduce((s,v)=>s+Number(v),0);
        return {...p, historique, termine: total>=p.objectif};
      });
      saveProjects(); render();
    });
  });
}

let profilState = null;
function attachProfilListeners(){
  profilState = {
    situation: profile.situation || "celibataire",
    nombreRevenus: profile.nombreRevenus || 1,
    aEnfants: !!profile.aEnfants,
    enfants: Array.isArray(profile.enfants) ? [...profile.enfants] : [],
  };
  const revenusBlock = document.getElementById("profil-revenus-block");
  const enfantsBlock = document.getElementById("profil-nombre-enfants-block");
  const enfantsListEl = document.getElementById("profil-enfants-list");
  const btnCeli = document.getElementById("profil-celibataire");
  const btnCouple = document.getElementById("profil-couple");
  const btnRev1 = document.getElementById("profil-rev-1");
  const btnRev2 = document.getElementById("profil-rev-2");
  const btnEnfantsNon = document.getElementById("profil-enfants-non");
  const btnEnfantsOui = document.getElementById("profil-enfants-oui");
  const btnAddEnfant = document.getElementById("profil-add-enfant");

  function styleToggle(activeBtn, inactiveBtn){
    activeBtn.style.background = "var(--royal)"; activeBtn.style.color = "var(--card)";
    inactiveBtn.style.background = "var(--bg-deep)"; inactiveBtn.style.color = "var(--muted)";
  }
  function syncEnfantsFromInputs(){ profilState.enfants = readEnfantsRows(profilState.enfants.length, "profil"); }
  function renderEnfantsList(){
    enfantsListEl.innerHTML = renderEnfantsRows(profilState.enfants, "profil");
    enfantsListEl.querySelectorAll("[data-remove-enfant]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        syncEnfantsFromInputs();
        profilState.enfants.splice(Number(btn.dataset.removeEnfant), 1);
        renderEnfantsList();
      });
    });
  }

  btnCeli.addEventListener("click", ()=>{ profilState.situation="celibataire"; profilState.nombreRevenus=1; styleToggle(btnCeli, btnCouple); revenusBlock.style.display="none"; });
  btnCouple.addEventListener("click", ()=>{ profilState.situation="couple"; styleToggle(btnCouple, btnCeli); revenusBlock.style.display="block"; });
  btnRev1.addEventListener("click", ()=>{ profilState.nombreRevenus=1; styleToggle(btnRev1, btnRev2); });
  btnRev2.addEventListener("click", ()=>{ profilState.nombreRevenus=2; styleToggle(btnRev2, btnRev1); });
  btnEnfantsNon.addEventListener("click", ()=>{ profilState.aEnfants=false; styleToggle(btnEnfantsNon, btnEnfantsOui); enfantsBlock.style.display="none"; });
  btnEnfantsOui.addEventListener("click", ()=>{
    profilState.aEnfants=true; styleToggle(btnEnfantsOui, btnEnfantsNon); enfantsBlock.style.display="block";
    if(profilState.enfants.length===0){ profilState.enfants.push({naissance:"", niveauEtude:NIVEAUX_ETUDE[0]}); renderEnfantsList(); }
  });
  btnAddEnfant.addEventListener("click", ()=>{
    syncEnfantsFromInputs();
    profilState.enfants.push({naissance:"", niveauEtude:NIVEAUX_ETUDE[0]});
    renderEnfantsList();
  });

  document.getElementById("profil-save").addEventListener("click", ()=>{
    const prenom = document.getElementById("profil-prenom").value.trim();
    if(profilState.aEnfants) syncEnfantsFromInputs();
    profile = {
      prenom: prenom || profile.prenom,
      naissance: document.getElementById("profil-naissance").value,
      situation: profilState.situation,
      nombreRevenus: profilState.situation==="couple" ? profilState.nombreRevenus : 1,
      aEnfants: profilState.aEnfants,
      enfants: profilState.aEnfants ? profilState.enfants : [],
      consentementAdmin: document.getElementById("profil-consentement").checked,
    };
    saveProfile();
    render();
  });

  document.getElementById("btn-switch-profile").addEventListener("click", ()=>{
    logout();
  });

  document.querySelectorAll(".pwd-toggle[data-toggle-target]").forEach(btn=>{
    btn.innerHTML = ICONS.eye;
    btn.addEventListener("click", ()=>{
      const input = document.getElementById(btn.dataset.toggleTarget);
      input.type = input.type === "password" ? "text" : "password";
    });
  });
  document.getElementById("btn-change-pwd").addEventListener("click", async ()=>{
    const oldPwd = document.getElementById("pwd-current").value;
    const newPwd = document.getElementById("pwd-new").value;
    const feedback = document.getElementById("pwd-feedback");
    feedback.style.display = "none";
    if(!oldPwd || newPwd.length < 8){
      feedback.textContent = "Indique ton mot de passe actuel et un nouveau mot de passe d'au moins 8 caractères.";
      feedback.style.color = "var(--coral)"; feedback.style.display = "block";
      return;
    }
    try{
      await doChangePassword(oldPwd, newPwd);
      document.getElementById("pwd-current").value = "";
      document.getElementById("pwd-new").value = "";
      feedback.textContent = "Mot de passe mis à jour. Prochain renouvellement dans 3 mois.";
      feedback.style.color = "var(--green)"; feedback.style.display = "block";
    }catch(e){
      feedback.textContent = translateAuthError(e.code);
      feedback.style.color = "var(--coral)"; feedback.style.display = "block";
    }
  });

  document.getElementById("btn-export").addEventListener("click", ()=>{
    const backup = { email: currentUser? currentUser.email : "", profile, items, projects, actuals, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `aurya-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("btn-import").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    const feedback = document.getElementById("import-feedback");
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.profile || !Array.isArray(data.items) || !Array.isArray(data.projects)){
          throw new Error("Format invalide");
        }
        profile = data.profile;
        items = data.items;
        projects = data.projects;
        actuals = data.actuals || {};
        saveProfile(); saveItems(); saveProjects(); saveActuals();
        feedback.textContent = "Sauvegarde restaurée avec succès dans ton espace actuel !";
        feedback.style.color = "var(--green)";
        render();
      }catch(err){
        feedback.textContent = "Ce fichier ne semble pas être une sauvegarde Aurya valide.";
        feedback.style.color = "var(--coral-soft)";
      }
    };
    reader.readAsText(file);
  });
}

/* ---------------------------------- CHAT (avec Hélène) ---------------------------------- */
let chatMessages = null; // null = pas encore chargé
let chatLoading = false;

async function loadChat(){
  chatLoading = true; render();
  try{
    const snap = await fbDb.collection("chats").doc(currentUser.uid).collection("messages").orderBy("ts","asc").get();
    chatMessages = [];
    snap.forEach(doc=> chatMessages.push(doc.data()));
  }catch(e){ console.error("Erreur chargement chat", e); chatMessages = []; }
  chatLoading = false; render();
}

function renderChat(){
  if(chatMessages === null){
    return `
    <h2 class="display" style="font-size:20px;margin-bottom:8px;">Discuter avec Hélène</h2>
    <div class="card"><p class="muted-dark" style="text-align:center;">Chargement de la conversation...</p></div>`;
  }
  // Le style (bulle "toi" / "Hélène") est déduit d'une comparaison booléenne, jamais du contenu stocké
  const thread = chatMessages.map(m => {
    const isMine = m.senderId === currentUser.uid;
    return `
    <div class="chat-msg ${isMine? 'from-user':'from-admin'}">
      <div>${esc(m.text)}</div>
      <div class="meta">${isMine? 'Toi':'Hélène'} · ${m.ts? new Date(m.ts).toLocaleString('fr-BE'):''}</div>
    </div>`;
  }).join("");
  return `
    <h2 class="display" style="font-size:20px;margin-bottom:8px;">Discuter avec Hélène</h2>
    <p class="muted" style="font-size:14px;margin-bottom:16px;">Une question sur ton budget ? Écris ici, Hélène te répond directement.</p>
    <div class="card">
      <div class="chat-thread" id="chat-thread">
        ${thread || `<p class="muted-dark" style="text-align:center;margin:0;">Aucun message pour l'instant. Dis bonjour !</p>`}
      </div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Écris ton message..." maxlength="2000" />
        <button class="btn btn-primary" id="chat-send">Envoyer</button>
      </div>
    </div>
  `;
}

function attachChatListeners(){
  if(chatMessages === null){ if(!chatLoading) loadChat(); return; }
  const threadEl = document.getElementById("chat-thread");
  if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;

  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");
  function send(){
    const text = input.value.trim();
    if(!text) return;
    const msg = { senderId: currentUser.uid, text, ts:new Date().toISOString() };
    chatMessages = [...chatMessages, msg];
    fbDb.collection("chats").doc(currentUser.uid).collection("messages").add(msg)
      .catch(e=>console.error(e));
    input.value = "";
    render();
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") send(); });
}

function renderShell(){

    {id:"postes", label:"Postes", icon:ICONS.list},

  let content = "";
  if(activeTab==="accueil") content = renderDashboard();
  else if(activeTab==="postes") content = renderPostes();
  else if(activeTab==="reel") content = renderReelTab();
  else if(activeTab==="projets") content = renderProjets();

  <div class="wrap" style="padding-bottom:60px;">
    <div class="app-header">
      <div class="brand">
        <img src="${LOGO_WORDMARK}" alt="Aurya" />

        <div class="status-row">

          <span class="version-tag">V01-027</span>

      </div>
      <div style="display:flex;gap:8px;">
        ${isUserAlsoAdmin? `<a href="admin.html" class="home-icon-btn" title="Espace conseil (admin)">${ICONS.shield}</a>` : ""}
        <a href="index.html" class="home-icon-btn" title="Accueil du site">${ICONS.home}</a>
      </div>
    </div>

    <div class="admin-tabs" style="margin-top:16px;">
      ${tabs.map(t=>`<button class="admin-tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.icon}<span style="margin-left:6px;">${t.label}</span></button>`).join("")}

    ${content}

    <footer class="legal-footer">
      <div class="legal-links">${renderLegalLinks()}</div>
      <div class="copyright-block">
        <p>© ${new Date().getFullYear()} Hélène Laruelle — Tous droits réservés. Toute copie du site ou de son code est interdite.</p>
        <p>Site développé par Hélène Laruelle.</p>
        <p>Contenu sous la responsabilité de Hélène Laruelle</p>
      </div>
    </footer>
  </div>`;
}
function attachShellListeners(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; render(); });
  });
  if(activeTab==="accueil") attachDashboardListeners();
  if(activeTab==="postes") attachPostesListeners();
  if(activeTab==="reel") attachReelListeners();
  if(activeTab==="projets") attachProjetsListeners();
  if(activeTab==="chat") attachChatListeners();
  if(activeTab==="profil") attachProfilListeners();
}

function renderReglementTab(){
  if(roiText === null){ loadRoiText(); return `<div class="card"><p class="muted-dark" style="text-align:center;">Chargement...</p></div>`; }
  const paragraphs = roiText.split("\n\n").map(p=>`<p style="font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:12px;">${esc(p)}</p>`).join("");
  const accepteLe = profile.roiAccepteLe ? new Date(profile.roiAccepteLe).toLocaleString('fr-BE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : null;
  return `
    <h2 class="display" style="font-size:20px;margin-bottom:16px;">Règlement d'ordre intérieur</h2>
    <div class="card">
      ${paragraphs}
      ${accepteLe? `<p class="muted-dark" style="font-size:12px;margin-top:16px;border-top:1px solid var(--card-lighter);padding-top:12px;">Accepté le ${accepteLe}.</p>` : ""}
    </div>
  `;
}
