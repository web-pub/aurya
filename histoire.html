<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/aurya-shared.js"></script>
</head>
<body>
  <div id="site-topbar-mount"></div>
  <div class="wrap" style="max-width:960px;margin:0 auto;padding:24px 16px 60px;">

    <div class="story-grid">
      <div class="card story-block">
        <img src="" id="story-logo" alt="Aurya" class="story-visual story-visual-logo" />
        <h1 class="display" style="font-size:22px;margin:16px 0 14px;">Notre histoire</h1>
        <div id="histoire-content"><p class="muted-dark">Chargement...</p></div>
      </div>

      <div class="card story-block">
        <img src="assets/helene-photo.jpg" alt="Hélène Laruelle" class="story-visual story-visual-photo" />
        <h2 class="display" style="font-size:22px;margin:16px 0 14px;">À propos de moi</h2>
        <div id="apropos-content"><p class="muted-dark">Chargement...</p></div>
      </div>
    </div>

    <div style="height:16px;"></div>
    <div class="card" style="text-align:center;">
      <a href="contact.html" class="btn btn-ghost">Me contacter</a>
    </div>

    <footer class="legal-footer">
      <div class="legal-links" id="legal-links-mount"></div>
      <div class="copyright-block">
        <p>© <span id="year"></span> Hélène Laruelle — Tous droits réservés. Toute copie du site ou de son code est interdite.</p>
        <p>Site développé par Hélène Laruelle.</p>
        <p>Contenu sous la responsabilité de Hélène Laruelle</p>
      </div>
    </footer>
  </div>
  <div class="hl-badge-wrap" id="hl-badge"></div>

<script>
document.getElementById("site-topbar-mount").innerHTML = renderSiteTopbar("histoire");
document.getElementById("story-logo").src = LOGO_WORDMARK;
document.getElementById("hl-badge").innerHTML = LOGO_HL_BADGE;
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("legal-links-mount").innerHTML = renderLegalLinks();

const DEFAULT_HISTOIRE = `Aurya trouve sa racine dans le mot latin "aurum", qui signifie l'or. Depuis l'Antiquité, l'or est le symbole de la valeur durable, de la stabilité, de la richesse construite dans le temps, de la confiance et de la transmission.

Plutôt que d'utiliser une référence directe à l'argent ou à la finance, Aurya transforme cette racine en un nom plus moderne, plus humain et plus accessible : AUR, pour aurum, l'or ; YA, une sonorité douce et positive qui rend le nom plus chaleureux qu'un terme purement financier.

Aurya évoque l'art de transformer ses ressources en valeur durable.

Chez Aurya, nous pensons qu'un budget n'est pas une contrainte, mais un outil de liberté. Chaque euro gagné, économisé ou investi possède sa propre valeur. Aurya aide chacun à révéler cette valeur, à mieux comprendre ses finances et à construire sereinement ses projets. Parce qu'une bonne gestion de budget ne consiste pas seulement à compter son argent : elle consiste à créer de la liberté pour demain.

Comme souvent, il y a aussi un niveau de lecture caché : AUR pour l'or, la valeur ; YA pour "il y a". On peut y lire, presque inconsciemment : "il y a de la valeur", ou "votre valeur est déjà là". C'est particulièrement juste pour un outil de budget : Aurya n'a pas la prétention de rendre riche du jour au lendemain, mais d'aider chacun à voir la valeur qu'il possède déjà, et à mieux l'utiliser.

« Aurya, révélez la valeur de chaque euro. »

Mais il y a une autre raison, plus personnelle, à la naissance d'Aurya. On apprend à lire, à écrire, à compter. On apprend l'histoire, les sciences, le sport — parfois même la religion. Mais personne ne nous apprend vraiment à gérer notre argent. Pourtant, contrairement à beaucoup de ces matières, tout le monde, un jour, devra établir un budget, payer ses factures, épargner pour ses projets et prendre des décisions financières importantes. Ouvrier, enseignant, indépendant, infirmier, employé ou entrepreneur : personne n'y échappe.

Chez Aurya, nous pensons que l'éducation financière n'est pas un privilège réservé aux experts-comptables ou aux financiers. C'est une compétence essentielle de la vie quotidienne, au même titre que lire ou écrire.

Notre mission est simple : rendre la gestion du budget accessible à tous, pour que chacun puisse comprendre ses finances, reprendre le contrôle de son avenir, et avancer sereinement vers ses projets de vie. Parce que tout le monde mérite de savoir gérer son argent — pas seulement les comptables, pas seulement les financiers. Tout le monde.`;

const DEFAULT_APROPOS = `Je m'appelle Hélène Laruelle. Je suis comptable de formation, et j'accompagne au quotidien des indépendants et des entreprises dans leur gestion administrative, comptable et RH.

Depuis des années, un constat me frappe : on apprend à lire, à écrire, à compter, on apprend l'histoire, les sciences, le sport — mais personne ne nous apprend vraiment à gérer notre argent. Pourtant, contrairement à beaucoup de ces matières, tout le monde, un jour, devra établir un budget, payer ses factures, épargner pour ses projets et prendre des décisions financières importantes. Ouvrier, enseignant, indépendant, infirmier, employé ou entrepreneur : personne n'y échappe, et presque personne n'y a été préparé.

Ce n'est pas un manque d'intelligence, c'est un manque de transmission. Pour moi, certaines notions paraissent évidentes — mais j'ai vu, dans mon métier, combien de personnes n'ont jamais eu l'occasion d'apprendre les bases.

J'ai voulu mettre ma rigueur de comptable au service de quelque chose de plus accessible : Aurya. Pas pour transformer chacun en expert-comptable, mais pour donner à tous les clés pour comprendre où va son argent, reprendre le contrôle de son budget, et avancer sereinement vers ses projets de vie.

Cette page t'appartient aussi un peu — dis-moi ce que tu aimerais y lire !`;

function renderBloc(elId, texte){
  document.getElementById(elId).innerHTML =
    texte.split("\n\n").map(p => `<p style="font-size:13px;line-height:1.75;color:var(--muted);margin-bottom:13px;">${p.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</p>`).join("");
}

renderBloc("histoire-content", DEFAULT_HISTOIRE);
renderBloc("apropos-content", DEFAULT_APROPOS);

if(initFirebaseApp()){
  const db = firebase.firestore();
  db.collection("siteContent").doc("histoire").get()
    .then(snap => { if(snap.exists && snap.data().texte) renderBloc("histoire-content", snap.data().texte); })
    .catch(()=>{});
  db.collection("siteContent").doc("apropos").get()
    .then(snap => { if(snap.exists && snap.data().texte) renderBloc("apropos-content", snap.data().texte); })
    .catch(()=>{});
}
</script>
</body>
</html>
