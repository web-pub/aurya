<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurya — la sérénité financière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/aurya-shared.js"></script>
</head>
<body>
  <div id="site-topbar-mount"></div>
  <div class="hero">
    <img class="wordmark" id="hero-logo" alt="Aurya" />
    <p class="slogan" id="txt-slogan"></p>
    <p class="pitch" id="txt-pitch"></p>
    <div class="hero-cta">
      <a href="connexion.html" class="btn btn-primary">Se connecter</a>
      <a href="connexion.html#devenir-membre" class="btn btn-ghost">Devenir membre</a>
    </div>
  </div>

  <div class="features">
    <div class="feature-card">
      <div class="feature-icon" id="f1-icon"></div>
      <h3 id="f1-titre"></h3>
      <p id="f1-texte"></p>
    </div>
    <div class="feature-card">
      <div class="feature-icon" id="f2-icon"></div>
      <h3 id="f2-titre"></h3>
      <p id="f2-texte"></p>
    </div>
    <div class="feature-card">
      <div class="feature-icon" id="f3-icon"></div>
      <h3 id="f3-titre"></h3>
      <p id="f3-texte"></p>
    </div>
  </div>

  <footer class="legal-footer">
    <div class="legal-links" id="legal-links-mount"></div>
    <div class="copyright-block">
      <p>© <span id="year"></span> Hélène Laruelle — Tous droits réservés. Toute copie du site ou de son code est interdite.</p>
      <p>Site développé par Hélène Laruelle.</p>
      <p>Contenu sous la responsabilité de Hélène Laruelle</p>
    </div>
  </footer>
  <div class="hl-badge-wrap" id="hl-badge"></div>

<script>
document.getElementById("hero-logo").src = LOGO_WORDMARK;
document.getElementById("site-topbar-mount").innerHTML = renderSiteTopbar("index");
document.getElementById("hl-badge").innerHTML = LOGO_HL_BADGE;
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("legal-links-mount").innerHTML = renderLegalLinks();

/* Contenu par défaut (utilisé tant que rien n'a été personnalisé depuis
   l'onglet "Contenu du site" de l'espace admin, ou si Firebase n'est pas
   encore configuré) — jamais codé en dur ailleurs que cette valeur de repli. */
const DEFAULT_CONTENT = {
  slogan: "« Chaque euro trouve sa place. »",
  pitch: "Aurya transforme le budget en un espace doux et clair, où chaque décision devient plus simple. Une lumière dans le quotidien : suivi des revenus et dépenses, mensualisation des charges annuelles, projets d'épargne personnalisés, et un accompagnement personnalisé si tu le souhaites.",
  f1_titre: "Postes complets", f1_texte: "Une bibliothèque de plus de 60 postes courants (logement, enfants, animaux, épargne...), en mensuel ou en annuel, convertis automatiquement.",
  f2_titre: "Projets d'épargne", f2_texte: "Fixe-toi un objectif (voyage, cadeau, imprévu...) et suis ce que tu arrives réellement à mettre de côté chaque mois.",
  f3_titre: "Accompagnement", f3_texte: "Si tu le souhaites, discute directement avec Hélène pour obtenir des conseils personnalisés sur ton budget.",
};

function applyContent(c){
  document.getElementById("txt-slogan").textContent = c.slogan;
  document.getElementById("txt-pitch").textContent = c.pitch;
  document.getElementById("f1-titre").textContent = c.f1_titre;
  document.getElementById("f1-texte").textContent = c.f1_texte;
  document.getElementById("f2-titre").textContent = c.f2_titre;
  document.getElementById("f2-texte").textContent = c.f2_texte;
  document.getElementById("f3-titre").textContent = c.f3_titre;
  document.getElementById("f3-texte").textContent = c.f3_texte;
}

// Icônes fixes (identité visuelle de la marque, non éditables — cohérence "site pro")
document.getElementById("f1-icon").innerHTML = ICONS.chart;
document.getElementById("f2-icon").innerHTML = ICONS.target;
document.getElementById("f3-icon").innerHTML = ICONS.chat;

applyContent(DEFAULT_CONTENT);
if(initFirebaseApp()){
  firebase.firestore().collection("siteContent").doc("public").get()
    .then(snap => { if(snap.exists) applyContent({ ...DEFAULT_CONTENT, ...snap.data() }); })
    .catch(()=>{ /* silencieux : on garde le contenu par défaut */ });
}
</script>
</body>
</html>
